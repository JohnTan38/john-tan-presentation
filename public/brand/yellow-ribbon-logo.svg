<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" role="img" aria-label="Yellow Ribbon Singapore - Selarang Halfway House">
  <defs>
    <linearGradient id="yrGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="yrRibbonFold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="ribbonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ribbon Symbol -->
  <g transform="translate(10, 8)" filter="url(#ribbonGlow)">
    <!-- Back loop / fold -->
    <path d="M 28 36 C 24 24 16 12 28 4 C 38 -3 48 8 40 24 L 20 58 C 18 61 14 62 10 59 L 4 54 C 2 52 3 48 6 46 L 24 32" 
          fill="url(#yrRibbonFold)" opacity="0.9" />
    <!-- Front loop -->
    <path d="M 20 26 C 26 12 36 -2 46 5 C 56 12 48 28 36 42 L 54 60 C 57 63 56 67 52 68 L 45 68 C 42 68 39 66 37 64 L 20 44" 
          fill="url(#yrGoldGrad)" />
    <!-- Center ribbon crossing knot -->
    <path d="M 24 28 C 28 32 32 36 36 40 C 32 44 26 38 22 34 Z" 
          fill="#B45309" opacity="0.4" />
  </g>

  <!-- Wordmark & Subtitle -->
  <text x="82" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">
    YELLOW RIBBON
  </text>
  <text x="246" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#D97706" letter-spacing="-0.01em">
    SINGAPORE
  </text>
  <text x="82" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#B45309" letter-spacing="0.08em">
    SELARANG HALFWAY HOUSE
  </text>
  <text x="82" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748B" letter-spacing="0.04em">
    Yellow Ribbon Industries · Singapore Prison Service Co-Management
  </text>
</svg>
